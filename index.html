async function http(path,opt){

function themeEff(){var t=lsGet('trial-theme');if(t==='light'||t==='dark')return t;return (window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}
function applyTheme(){var t=lsGet('trial-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme')}
function themeBtn(){var dk=themeEff()==='dark';return '<button type="button" class="btn sec sm" data-act="theme" aria-label="'+(dk?'التحويل إلى الوضع النهاري':'التحويل إلى الوضع الليلي')+'">'+(dk?'☀ الوضع النهاري':'☾ الوضع الليلي')+'</button>'}

/* ---------- القالب العام ---------- */
function netB(){return '<span class="net '+(navigator.onLine?'on':'off')+'">'+(navigator.onLine?'● متصل':'○ بدون نت')+'</span>'}
function navFor(){
  if(P.role==='student')return [['sHome','المواد',['sSubject','sExam','sResult']],['sMistakes','أخطائي'],['sGrades','درجاتي'],['notes','الإشعارات']];
  if(P.role==='school_admin')return [['aOver','نظرة عامة'],['aStu','الطلاب'],['aTea','المدرسون'],['aCls','الفصول']];
  return [['tHome','الفصول',['tClass']],['tGrading','التصحيح'],['tResults','النتائج'],['notes','الإشعارات']]}
function badgeFor(v){var x=v==='notes'?C.unread:(v==='tGrading'?C.pend:0);return x?n(x):''}
function shell(inner){
  var nav=navFor(),q=C.queue.length;
  return '<header class="top"><div class="brand"><span class="logo">'+ICON+'</span><b>المدرسة الإلكترونية</b></div><nav>'+nav.map(function(x){var b=badgeFor(x[0]);return '<button type="button" class="nv'+(R.v===x[0]||(x[2]&&x[2].indexOf(R.v)>-1)?' on':'')+'" data-act="go" data-v="'+x[0]+'">'+x[1]+' <span class="badge warn" data-bd="'+x[0]+'"'+(b?'':' hidden')+'>'+b+'</span></button>'}).join('')+'</nav><div class="who">'+themeBtn()+netB()+(q?bdg('بانتظار رفع '+n(q),'warn'):'')+'<span>'+esc(P.name)+'</span><button type="button" class="lnk" data-act="myPw">تغيير كلمة المرور</button><button type="button" class="lnk" data-act="logout">تسجيل الخروج</button></div></header><main class="wrap">'+inner+'</main>'}
function loading(){return '<div class="card center"><div class="sub">جارٍ التحميل…</div></div>'}
function failed(){return '<div class="msg bad">'+esc(LOADERR)+'</div><div class="row">'+btn('إعادة المحاولة','reload')+'</div>'}

/* ---------- الدخول ---------- */
function vLogin(){
  return '<div class="auth"><div class="row" style="justify-content:flex-end">'+themeBtn()+'</div><div class="center card" style="gap:6px"><span class="logo" style="width:56px;height:56px">'+ICON+'</span><h1>المدرسة الإلكترونية</h1><span class="sub">نسخة تجريبية</span></div><form class="card" data-submit="doLogin">'+fld('الكود أو اسم المستخدم','code',{ph:'مثال: 10452-s-0001',dir:'ltr',ac:'username'})+fld('كلمة المرور','pw',{type:R.f.showpw?'text':'password',ac:'current-password',dir:'ltr'})+'<div class="row" style="margin-top:-6px"><button type="button" class="lnk" data-act="togglePw" aria-pressed="'+(R.f.showpw?'true':'false')+'">'+(R.f.showpw?'🙈 إخفاء كلمة المرور':'👁 إظهار كلمة المرور')+'</button></div>'+err()+'<button class="btn" type="submit"'+(BUSY?' disabled':'')+'>'+(BUSY?'جارٍ الدخول…':'دخول')+'</button><span class="hint">الكود تحصل عليه من إدارة المدرسة، وكلمة المرور المؤقتة تُعطى لك معه.</span></form></div>'}
function vOther(){return '<div class="auth"><div class="card center"><h2>أهلاً '+esc(P.name)+'</h2><div class="msg warn">هذا الحساب ('+esc(P.role)+') يُدار في هذه التجربة من لوحة Supabase. الشاشات المتاحة هنا للطالب والمدرس فقط.</div>'+'<div class="row">'+themeBtn()+btn('تسجيل الخروج','logout')+'</div></div></div>'}

/* ---------- الطالب ---------- */
function ovOf(sj,k){return (C.ov||[]).filter(function(a){return a.subject_id==sj&&(!k||a.kind===k)})}
function todoOf(a){if(a.submitted||!a.released)return false;if(a.kind==='H')return !!a.deadline&&Date.now()<Date.parse(a.deadline);return a.open_now}
function vSHome(){
  var h='<div><h1>أهلاً '+esc(P.name.split(' ')[0])+'</h1><span class="sub">'+(P.class?esc(P.class)+' · ':'')+esc(P.school||'')+' · كودك '+esc(P.code)+'</span></div>';
  if(!C.subs.length)return h+'<div class="msg warn">لم تتم إضافتك إلى فصل بعد. تواصل مع إدارة المدرسة.</div>';
  return h+'<div class="grid">'+C.subs.map(function(s){var todo=ovOf(s.subject_id).filter(todoOf).length;
    return '<button type="button" class="subj" data-act="subject" data-s="'+s.subject_id+'"><h3>'+esc(s.name)+'</h3><span class="sub">'+(s.teacher?'أ. '+esc(s.teacher):'')+'</span>'+(todo?bdg('مطلوب الآن: '+n(todo),'warn'):bdg('لا شيء مطلوب','ok'))+'</button>'}).join('')+'</div>'}
function rowA(a){
  var st=bdg(''),act='',lock='';
  if(!a.released){st=bdg('لم ينزل بعد · ينزل '+fd(a.release_at));lock=' lock'}
  else if(a.submitted){
    if(a.late_pending)st=bdg('سلّمت · ينتظر قرار المدرس في التأخير','warn');
    else if(a.rejected)st=bdg('رُفض التسليم المتأخر','bad');
    else st=bdg('سلّمت','ok')+(a.answers_visible?(a.score!=null?' '+bdg(fmtN(a.score)+' من '+fmtN(a.max),'pri'):'')+(a.awaiting_teacher?' '+bdg('بانتظار التصحيح','warn'):''):' '+bdg('الدرجة بعد فتح الإجابات'));
    act=btn(a.answers_visible?'الإجابات والدرجة':'عرض','result',{a:a.id},'sec sm');
    if(queued(a.id))st=bdg('محفوظ على التابلت · يُرفع عند توفر النت','warn')}
  else if(a.answers_visible){st=bdg('فاتك · الإجابات النموذجية متاحة','warn');act=btn('الإجابات النموذجية','result',{a:a.id},'sec sm')}
  else if(a.kind==='H'){var dl=Date.parse(a.deadline);if(Date.now()<dl){st=bdg('مفتوح · آخر موعد '+fd(dl),'ok');act=btn(a.started?'تابع':'ابدأ','exam',{a:a.id},'sm')}else{st=bdg('انتهى الموعد','bad')}}
  else if(a.open_now){st=bdg('مفتوح الآن','ok');act=btn(a.started?'تابع':'ابدأ الآن','exam',{a:a.id},'sm')}
  else{st=bdg('بانتظار فتح المدرس');lock=' lock'}
  return '<div class="wk'+lock+'"><span class="t">'+esc(a.title)+'</span>'+st+act+'</div>'}
function vSSubject(){
  var sj=R.s,k=R.tab||'A',list=ovOf(sj,k);
  var tabs='<div class="tabs">'+['A','C','H'].map(function(x){return '<button type="button" class="tab'+(k===x?' on':'')+'" data-act="tab" data-t="'+x+'">'+KN[x]+'</button>'}).join('')+'</div>';
  return '<div class="row"><button type="button" class="lnk" data-act="go" data-v="sHome">← المواد</button></div><h1>'+esc(sn(sj))+'</h1>'+tabs+(k==='H'?'<div class="msg warn">الأداء المنزلي يفتح عند نزوله ويتقفل بعد أسبوع.</div>':'<div class="sub">ينزل مقفولاً ويفتحه المدرس أثناء الحصة.</div>')+'<div style="display:flex;flex-direction:column;gap:10px">'+(list.length?list.map(rowA).join(''):'<div class="msg">لا يوجد شيء بعد.</div>')+'</div>'}

/* الامتحان */
function examKey(aid){return 'exam:'+P.id+':'+aid}
function queued(aid){return C.queue.some(function(x){return x.aid==aid})}
function qOrder(ex){return shuffled(ex.d.questions,P.id+':'+ex.d.assessment.id)}
function vSExam(){
  var ex=C.ex,a=ex.d.assessment,end=Date.parse(ex.d.ends_at),isH=a.kind==='H';
  var h='<div class="row" style="justify-content:space-between"><div><h1>'+esc(sn(a.subject_id))+'</h1><span class="sub">'+esc(a.title)+'</span></div><div class="row">'+netB()+(isH?'<span class="sub">آخر موعد '+fd(end)+'</span>':'<span class="timer" id="tm">'+mmss(end-(Date.now()+ex.off))+'</span>')+'</div></div>';
  var qs=qOrder(ex).map(function(q,pos){var dr=' dir="'+(q.dir==='ltr'?'ltr':'rtl')+'"',hd=showQ(q,pos+1),ans=ex.ans[q.id];
    var opts=shuffled(q.options,P.id+':'+q.id);
    if(q.type==='mcq')return '<div class="q"'+dr+'>'+hd+opts.map(function(o){return '<label class="opt"><input type="radio" name="q'+q.id+'" value="'+o.id+'" data-chg="ans" data-q="'+q.id+'"'+(ans===o.id?' checked':'')+'><span>'+esc(o.body)+'</span></label>'}).join('')+'</div>';
    if(q.type==='multi')return '<div class="q"'+dr+'>'+hd+'<span class="hint">اختر كل الإجابات الصحيحة.</span>'+opts.map(function(o){return '<label class="opt"><input type="checkbox" value="'+o.id+'" data-chg="ansm" data-q="'+q.id+'"'+((ans||[]).indexOf(o.id)>-1?' checked':'')+'><span>'+esc(o.body)+'</span></label>'}).join('')+'</div>';
    return '<div class="q"'+dr+'>'+hd+'<span class="hint">سؤال مقالي يصححه المدرس.</span><textarea class="inp" '+dr+' data-inp="essay" data-q="'+q.id+'" style="min-height:120px;padding:10px">'+esc(ans||'')+'</textarea></div>'}).join('');
  var foot=R.confirm?'<div class="msg warn">متأكد من التسليم؟ لا يمكن التعديل بعده.</div><div class="row">'+btn('نعم، سلّم','submitYes')+btn('رجوع للأسئلة','submitNo','','sec')+'</div>':btn('تسليم','submitAsk');
  return h+(navigator.onLine?'':'<div class="msg">انقطع النت. إجاباتك محفوظة على التابلت أولاً بأول، وسيُرفع الحل تلقائياً عند عودة النت.</div>')+qs+'<div style="display:flex;flex-direction:column;gap:10px">'+foot+'</div>'}

function vSResult(){
  var rv=C.rv,a=rv.assessment,total=0,max=0;
  if(rv.queuedOnly)return '<div class="row"><button type="button" class="lnk" data-act="subject" data-s="'+a.subject_id+'" data-t="'+a.kind+'">← '+esc(sn(a.subject_id))+'</button></div><div class="card"><h1>'+esc(sn(a.subject_id))+' · '+esc(a.title)+'</h1><div class="msg warn"><b>تم الحفظ على التابلت ✓</b><br>إجاباتك محفوظة وستُرفع تلقائياً عند توفر النت. لا تغلق المتصفح قبل أن تختفي علامة «بانتظار الرفع».</div></div>';
  rv.questions.forEach(function(q){max+=Number(q.points);if(q.points_got!=null)total+=Number(q.points_got)});
  var pend=rv.questions.some(function(q){return q.points_got==null&&rv.answers_visible&&rv.counted});
  var st=queued(a.id)?'<div class="msg warn">إجاباتك محفوظة على التابلت وستُرفع تلقائياً عند توفر النت.</div>':
    (rv.late_pending?'<div class="msg warn">وصل التسليم متأخراً أكثر من يوم، وينتظر قرار المدرس.</div>':(rv.rejected?'<div class="msg bad">رفض المدرس التسليم المتأخر.</div>':''));
  var top=rv.answers_visible?(rv.submitted&&rv.counted?'<div class="row"><span class="timer">'+fmtN(total)+' من '+fmtN(max)+'</span>'+(pend?'<span class="sub">الدرجة تكتمل بعد تصحيح المدرس</span>':'')+'</div>':(rv.submitted?'':'<div class="msg warn">لم تحل هذا. هذه الإجابات النموذجية لتستفيد منها.</div>')):'<div class="msg ok"><b>تم الحفظ ✓</b><br>تظهر الدرجة والإجابات الصحيحة بعد '+(a.kind==='H'?'انتهاء موعد الأداء المنزلي':'أن يفتح المدرس نموذج الإجابة')+'.</div>';
  var det=rv.answers_visible||rv.submitted?rv.questions.map(function(q,i){return '<div class="q" dir="'+(q.dir==='ltr'?'ltr':'rtl')+'">'+showQ(q,i+1)+qReview(q,'s')+(rv.answers_visible&&rv.submitted&&rv.counted?'<div class="row">'+scoreBadge(q)+'</div>':'')+'</div>'}).join(''):'';
  return '<div class="row"><button type="button" class="lnk" data-act="subject" data-s="'+a.subject_id+'" data-t="'+a.kind+'">← '+esc(sn(a.subject_id))+'</button></div><div class="card"><h1>'+esc(sn(a.subject_id))+' · '+esc(a.title)+'</h1>'+st+top+'</div>'+det}

function vSMistakes(){
  var sj=R.f.sj||'all',all=C.mist||[],list=all.filter(function(m){return sj==='all'||m.assessment.subject_id==sj});
  var subs=[['all','كل المواد']].concat(C.subs.map(function(s){return [s.subject_id,s.name]}));
  return '<h1>أخطائي</h1><div class="sub">الأسئلة التي لم تأخذ درجتها كاملة في التقييمات التي فُتحت إجاباتها.</div><div class="card">'+sel('المادة','sj',subs,1)+'</div>'+
    (list.length?list.map(function(m){var q=m.q;return '<div class="q" dir="'+(q.dir==='ltr'?'ltr':'rtl')+'">'+showQ(q,1)+'<span class="sub">'+esc(sn(m.assessment.subject_id))+' · '+esc(m.assessment.title)+'</span>'+qReview(q,'s')+'<div class="row">'+scoreBadge(q)+'</div></div>'}).join(''):'<div class="msg ok">لا توجد أخطاء لمراجعتها الآن.</div>')}
function vSGrades(){
  var rows=C.subs.map(function(s){var l=ovOf(s.subject_id).filter(function(a){return a.score!=null}),t=0,m=0;l.forEach(function(a){t+=Number(a.score);m+=Number(a.max)});
    return '<tr><td>'+esc(s.name)+'</td><td>'+n(l.length)+'</td><td>'+(l.length?fmtN(Math.round(t*10)/10)+' من '+fmtN(m):'—')+'</td></tr>'}).join('');
  var det=(C.ov||[]).filter(function(a){return a.score!=null}).map(function(a){return '<tr><td>'+esc(sn(a.subject_id))+'</td><td>'+esc(a.title)+'</td><td>'+fmtN(a.score)+' من '+fmtN(a.max)+'</td></tr>'}).join('');
  return '<h1>درجاتي</h1><div class="card"><h3>ملخص المواد</h3><div class="tbl"><table><thead><tr><th>المادة</th><th>عدد ما صُحّح</th><th>المجموع</th></tr></thead><tbody>'+rows+'</tbody></table></div></div><div class="card"><h3>التفاصيل</h3><div class="tbl"><table><thead><tr><th>المادة</th><th>التقييم / الأداء</th><th>الدرجة</th></tr></thead><tbody>'+(det||'<tr><td colspan="3">لا توجد درجات ظاهرة بعد.</td></tr>')+'</tbody></table></div><span class="hint">تظهر الدرجة بعد فتح الإجابات.</span></div>'}

/* ---------- الإشعارات ---------- */
function vNotes(){var l=C.notes||[];return '<h1>الإشعارات</h1><div class="sub">تصلك إشعارات عند فتح المدرس تقييماً أو أداءً لفصلك، وعند فتح نموذج الإجابة'+(P.role==='student'?'، وعند تصحيح درجتك.':'.')+'</div>'+
  (l.length?l.map(function(x){return '<div class="note'+(x.fresh?' new':'')+'"><b>'+esc(x.body)+'</b><span class="sub">'+fd(x.at)+' · '+ft(x.at)+'</span></div>'}).join(''):'<div class="card"><div class="msg">لا توجد إشعارات.</div></div>')}

/* ---------- المدرس ---------- */
function clsOf(id){return (C.cls||[]).filter(function(c){return c.id==id})[0]}
function vTHome(){
  if(!C.cls.length)return '<h1>فصولي</h1><div class="msg warn">لم تُضف إلى أي فصل بعد. تواصل مع إدارة المدرسة.</div>';
  return '<h1>فصولي</h1><div class="grid">'+C.cls.map(function(c){return (c.subjects||[]).map(function(s){return '<button type="button" class="subj" data-act="tclass" data-c="'+c.id+'" data-s="'+s.id+'"><h3>'+esc(c.name)+'</h3><span class="sub">'+esc(s.name)+' · '+n(c.students.length)+' طالب</span></button>'}).join('')}).join('')+'</div>'}
function tabsK(k){return '<div class="tabs">'+['A','C','H'].map(function(x){return '<button type="button" class="tab'+(k===x?' on':'')+'" data-act="tab" data-t="'+x+'">'+KN[x]+'</button>'}).join('')+'</div>'}
function vTClass(){
  var c=clsOf(R.c),k=R.tab||'A',list=(C.tas||[]).filter(function(a){return a.kind===k});
  var h='<div class="row"><button type="button" class="lnk" data-act="go" data-v="tHome">← الفصول</button></div><div><h1>'+esc(c.name)+' · '+esc(sn(R.sj))+'</h1><span class="sub">'+n(c.students.length)+' طالب</span></div>'+tabsK(k)+okm()+err();
  if(k==='H')h+='<div class="msg warn">الأداء المنزلي يُفتح تلقائياً عند نزوله ويقفل بعد أسبوع، ولا يحتاج فتحاً منك.</div>';
  else h+='<div class="sub">يمكنك الفتح خلال ٧ أيام من النزول. المدة من ٣٥ إلى ٩٠ دقيقة.</div>';
  h+=list.length?list.map(function(a){return cardTA(a,c,k)}).join(''):'<div class="msg">لا يوجد شيء نزل بعد.</div>';
  return h}
function cardTA(a,c,k){
  var h='<div class="card"><div class="row" style="justify-content:space-between"><b>'+esc(a.title)+'</b><span class="sub">سلّم '+n(a.submitted)+' من '+n(c.students.length)+'</span></div>';
  if(k==='H'){h+='<div class="row">'+(a.expired?bdg('انتهى الموعد','bad'):bdg('مفتوح حتى '+fd(a.deadline),'ok'))+(a.answers_visible?bdg('الإجابات مفتوحة','pri'):'')+'</div></div>';return h}
  var o=a.open;
  if(o){var total=Math.round((Date.parse(o.end_at)-Date.parse(o.start_at))/MIN);
    h+='<div class="row">'+bdg('مفتوح الآن حتى '+ft(o.end_at),'ok')+'<span class="sub">'+n(o.students)+' طالب · المدة '+n(total)+' دقيقة</span></div><div class="row">'+btn('− ٥ دقائق','openMin',{o:o.id,m:total-5},'sec sm',total<=35)+btn('+ ٥ دقائق','openMin',{o:o.id,m:total+5},'sec sm',total>=90)+btn('إغلاق الآن','closeOpen',{o:o.id},'sec sm')+'</div><span class="hint">عند الإغلاق المبكر يكمل من بالداخل حتى مرور ٣٥ دقيقة من البداية.</span>'}
  else if(a.revealed||a.answers_visible)h+='<div class="row">'+bdg(a.revealed?'فُتح نموذج الإجابة للفصل':'الإجابات مفتوحة تلقائياً','pri')+'</div>';
  else{
    if(a.expired)h+='<div class="msg warn">انتهت مهلة الفتح (٧ أيام من النزول).</div>';
    else if(R.openA===a.id){var f=R.of;h+='<div class="row"><b>المدة</b><span class="row" style="gap:8px;flex-wrap:nowrap">'+btn('−','dur',{d:-5},'sec sm')+'<b style="min-width:90px;text-align:center">'+n(f.dur)+' دقيقة</b>'+btn('+','dur',{d:5},'sec sm')+'</span><span class="hint">من ٣٥ إلى ٩٠ دقيقة.</span></div><div><b>الطلاب الذين سيُفتح لهم ('+n(c.students.length-f.off.length)+' من '+n(c.students.length)+')</b>'+c.students.map(function(s){return '<label class="chk"><input type="checkbox" data-chg="stu" data-id="'+s.id+'"'+(f.off.indexOf(s.id)<0?' checked':'')+'><span>'+esc(s.name)+'</span></label>'}).join('')+'</div><div class="row">'+btn('فتح '+KN[k]+' للطلاب','doOpen',{a:a.id})+btn('إلغاء','cancelOpen','','sec')+'</div>';}
    else h+='<div class="row">'+btn('فتح للطلاب','askOpen',{a:a.id})+(a.ever_opened?btn('فتح نموذج الإجابة للفصل','askReveal',{a:a.id},'sec'):'')+'</div>';
    if(R.revA===a.id)h+='<div class="msg warn">سيرى طلاب الفصل الإجابات الصحيحة ودرجاتهم بعد الفتح. متأكد؟</div><div class="row">'+btn('نعم، افتح النموذج','doReveal',{a:a.id})+btn('إلغاء','cancelReveal','','sec')+'</div>'}
  return h+'</div>'}

function gkey(p){return p.sub_id+'#'+p.question_id}
function gdef(p){return p.type==='multi'?0:Number(p.points)}
function gval(p){R.gv=R.gv||{};var k=gkey(p);return R.gv[k]==null?gdef(p):R.gv[k]}
function vTGrading(){

  tGrading:async function(){C.pend=await rpc('teacher_pending');C.pendN=C.pend.length},
  tResults:async function(){
    if(!C.cls)C.cls=await rpc('teacher_classes');
    var f=R.f,c=clsOf(f.c)||C.cls[0];if(!c)return;f.c=c.id;
    var sj=(c.subjects||[]).filter(function(s){return s.id==f.sj})[0]||(c.subjects||[])[0];if(!sj){C.tas=[];C.weeks=[];C.res=[];return}f.sj=sj.id;
    C.tas=await rpc('teacher_assessments',{p_class:c.id,p_subject:sj.id});
    var ws=[];C.tas.forEach(function(a){if(ws.indexOf(a.week)<0)ws.push(a.week)});ws.sort(function(x,y){return x-y});C.weeks=ws;
    if(!ws.length){C.res=[];f.aid=0;return}
    f.w=ws.indexOf(+f.w)>-1?+f.w:ws[ws.length-1];f.k=f.k||'A';
    var a=C.tas.filter(function(x){return x.week==f.w&&x.kind===f.k})[0];
    if(!a){C.res=[];f.aid=0;return}f.aid=a.id;
    C.res=await rpc('teacher_results',{p_class:c.id,p_aid:a.id})}
};
async function go(v,p,keep){
  R=Object.assign({v:v,f:{}},p||{});MODAL='';LOADERR='';
  if(P&&P.role==='student'){if(v==='sExam')lsSet('trial-resume:'+P.id,{a:R.a});else lsDel('trial-resume:'+P.id)}
  if(keep&&keep.f)R.f=keep.f;
  await reload();window.scrollTo(0,0)}
async function reload(){
  R.loading=!!LOAD[R.v];LOADERR='';draw();
  try{if(LOAD[R.v])await LOAD[R.v]()}catch(e){LOADERR=emsg(e)}
  R.loading=false;draw();
  if(R.v==='notes')pollBadges()}
async function afterLogin(){
  P=await rpc('my_profile');
  if(!P){throw new Error('الحساب غير مُعد في النظام. تواصل مع الإدارة.')}
  try{REF=await rpc('ref_data')}catch(e){}
  C.queue=lsGet('subq:'+P.id)||[];
  var rs=P.role==='student'?lsGet('trial-resume:'+P.id):null;
  if(rs&&lsGet(examKey(rs.a)))await go('sExam',{a:rs.a});
  else await go(P.role==='student'?'sHome':(P.role==='teacher'?'tHome':(P.role==='school_admin'?'aOver':'other')));

/* ---------- رفع الإجابات (يعمل بدون نت ثم يرفع) ---------- */
var FLUSHING=false;
function saveQ(){lsSet('subq:'+P.id,C.queue)}
async function flushQueue(){
  if(FLUSHING||!P||!C.queue.length||!navigator.onLine)return;FLUSHING=true;var changed=false;
  try{while(C.queue.length){var it=C.queue[0];
    try{await rpc('submit_exam',{p_aid:it.aid,p_answers:it.answers,p_finished:it.fin,p_auto:it.auto});C.queue.shift();saveQ();changed=true}
    catch(e){if(e.net)break;C.queue.shift();saveQ();changed=true;if(!/سلّمت|already/.test(e.message))C.lastErr=emsg(e)}}
  }finally{FLUSHING=false}
  if(changed){if(R.v==='sSubject'||R.v==='sHome'||R.v==='sResult'||R.v==='sGrades')await reload();else draw()}else if(R.v==='sResult'||R.v==='sSubject')draw()}
function buildAnswers(ex){return ex.d.questions.map(function(q){var a=ex.ans[q.id];
  if(q.type==='essay')return {q:q.id,text:a||''};
  return {q:q.id,opts:q.type==='mcq'?(a==null?[]:[a]):(a||[])}})}
async function submitExam(auto){
  var ex=C.ex,a=ex.d.assessment,now=Date.now()+ex.off,end=Date.parse(ex.d.ends_at);
  var fin=new Date(a.kind==='H'?Math.min(now,end):Math.min(now,end)).toISOString();
  C.queue.push({aid:a.id,answers:buildAnswers(ex),fin:fin,auto:!!auto,meta:{id:a.id,kind:a.kind,subject_id:a.subject_id,title:a.title}});saveQ();lsDel(examKey(a.id));C.ex=null;R.confirm=false;
  R.v='sResult';R.a=a.id;MODAL='';lsDel('trial-resume:'+P.id);
  R.loading=true;draw();await flushQueue();
  try{await LOAD.sResult()}catch(e){LOADERR=emsg(e)}R.loading=false;draw()}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;

function bind(e,ch){
  var el=e.target,ds=el.dataset;
  if(ds.chg==='ans'){var ex=C.ex;if(ex){ex.ans[+ds.q]=+el.value;lsSet(examKey(ex.d.assessment.id),ex)}return}
  if(ds.chg==='ansm'){var ex2=C.ex;if(ex2){var ar=ex2.ans[+ds.q]=ex2.ans[+ds.q]||[],j=+el.value,ix=ar.indexOf(j);if(el.checked&&ix<0)ar.push(j);if(!el.checked&&ix>-1)ar.splice(ix,1);lsSet(examKey(ex2.d.assessment.id),ex2)}return}
  if(ds.inp==='essay'){var ex3=C.ex;if(ex3){ex3.ans[+ds.q]=el.value;lsSet(examKey(ex3.d.assessment.id),ex3)}return}
  if(ds.chg==='tsub'){var sb=R.f.subs=R.f.subs||[],id=+ds.id,ii=sb.indexOf(id);if(el.checked&&ii<0)sb.push(id);if(!el.checked&&ii>-1)sb.splice(ii,1);return}
  if(ds.chg==='esub'){var eb=R.f.esubs=R.f.esubs||[],ei=+ds.id,ej=eb.indexOf(ei);if(el.checked&&ej<0)eb.push(ei);if(!el.checked&&ej>-1)eb.splice(ej,1);return}
  if(ds.chg==='cst'){var es=R.es=R.es||[],i2=es.indexOf(ds.id);if(el.checked&&i2<0)es.push(ds.id);if(!el.checked&&i2>-1)es.splice(i2,1);return}
  if(ds.chg==='ct'){if(ch)setTeacher(ds,el.value);return}
  if(ds.chg==='stu'){var f=R.of,i=f.off.indexOf(ds.id);if(!el.checked&&i<0)f.off.push(ds.id);if(el.checked&&i>-1)f.off.splice(i,1);if(ch)draw();return}
  if(ds.bind){var b=ds.bind;R.f[b]=el.value;
    if(ch&&ds.rr){R.f.err='';R.f.ok='';if(b==='c'){R.f.sj=0;R.f.w=0}if(b==='sj')R.f.w=0;R.f.aid=0;reload()}
    if(ch&&ds.dr){if(b==='g')R.f.cl='';draw()}}}
