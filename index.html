<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تقييمي</title><meta name="theme-color" content="#0E7C73"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>

/* Layout: top bar + role nav, centered content column, fixed demo bar at the bottom */
:root{--bg:#F7F4EE;--card:#FFFDF9;--fg:#1F2A2E;--mut:#586468;--bd:#E8E2D6;--pri:#0E7C73;--pri2:#0A5F58;--prit:#E3F3EF;--onpri:#FFFFFF;--warn:#FDF0D5;--warnt:#7A4A00;--ok:#E3F3E6;--okt:#1B5E2E;--bad:#FCE8E6;--badt:#A3201A;--del:#B42318;--delt:#B42318;--delbg:#FDECEA;--side:#1F2A2E;--onside:#FFFFFF;--inp:#FFFFFF;--chip:#EFEADF;--shadow:0 1px 2px rgba(31,42,46,.08),0 4px 14px rgba(31,42,46,.05);--i0b:#FBE9C9;--i0f:#7A4A00;--i1b:#DBE8FB;--i1f:#1F4F9A;--i2b:#D9F0E2;--i2f:#1D6A3F;--i3b:#E6DCF7;--i3f:#5A3A9A;--i4b:#FADBE3;--i4f:#9A2A4A;--i5b:#F6DCCD;--i5f:#8A3D1C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111A1C;--card:#1A2528;--fg:#E8EEEE;--mut:#A9B8BA;--bd:#2C3A3E;--pri:#4CC2B6;--pri2:#7AD6CC;--prit:#17393A;--onpri:#06211F;--warn:#3A2D12;--warnt:#F3D08F;--ok:#17331E;--okt:#A6DFAE;--bad:#3E1D1D;--badt:#F7A8A1;--del:#D92D20;--delt:#FF9A92;--delbg:#3E1D1D;--side:#0B1214;--onside:#E8EEEE;--inp:#101A1C;--chip:#223034;--shadow:none;--i0b:#4A3A16;--i0f:#F6D690;--i1b:#1E3556;--i1f:#B5D0FA;--i2b:#1B3F2B;--i2f:#A8E3C0;--i3b:#34285A;--i3f:#D3C3F5;--i4b:#51243A;--i4f:#F7B8CC;--i5b:#4E2D1D;--i5f:#F2C3AA;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111A1C;--card:#1A2528;--fg:#E8EEEE;--mut:#A9B8BA;--bd:#2C3A3E;--pri:#4CC2B6;--pri2:#7AD6CC;--prit:#17393A;--onpri:#06211F;--warn:#3A2D12;--warnt:#F3D08F;--ok:#17331E;--okt:#A6DFAE;--bad:#3E1D1D;--badt:#F7A8A1;--del:#D92D20;--delt:#FF9A92;--delbg:#3E1D1D;--side:#0B1214;--onside:#E8EEEE;--inp:#101A1C;--chip:#223034;--shadow:none;--i0b:#4A3A16;--i0f:#F6D690;--i1b:#1E3556;--i1f:#B5D0FA;--i2b:#1B3F2B;--i2f:#A8E3C0;--i3b:#34285A;--i3f:#D3C3F5;--i4b:#51243A;--i4f:#F7B8CC;--i5b:#4E2D1D;--i5f:#F2C3AA;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Cairo',system-ui,sans-serif;font-size:16px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:26px}h2{font-size:20px}h3{font-size:17px}
button,input,select,textarea{font-family:inherit;font-size:16px;color:var(--fg)}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 0;max-width:1080px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-size:18px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--pri);color:var(--onpri);display:flex;align-items:center;justify-content:center}
.top nav{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.nv{display:flex;align-items:center;gap:8px;min-height:42px;padding:0 14px;border-radius:10px;border:0;background:transparent;color:var(--fg);font-weight:600;cursor:pointer}
.nv.on{background:var(--pri);color:var(--onpri)}
.nv:not(.on):hover{background:var(--chip)}
.who{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:14px}
.lnk{border:0;background:none;color:var(--pri);font-weight:700;cursor:pointer;text-decoration:underline;padding:6px}
.wrap{max-width:1080px;margin:0 auto;padding-block:12px 24px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.sub{color:var(--mut);font-size:14px}
.btn{min-height:46px;padding:0 20px;border:0;border-radius:12px;background:var(--pri);color:var(--onpri);font-weight:700;cursor:pointer}
.btn:hover{background:var(--pri2);color:var(--onpri)}
.btn.sec{background:var(--chip);color:var(--fg)}.btn.sec:hover{background:var(--bd);color:var(--fg)}
.btn.dark{background:var(--side);color:var(--onside)}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px;border-radius:9px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.fld{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:15px;flex:1;min-width:200px}
.fld input,.fld select,.fld textarea,.inp{min-height:46px;border:1px solid var(--bd);border-radius:10px;padding:0 12px;background:var(--inp);width:100%}
.fld textarea{padding:10px 12px;min-height:110px;line-height:1.7}
.hint{font-size:13px;font-weight:400;color:var(--mut)}
.badge{display:inline-flex;align-items:center;padding:2px 12px;border-radius:999px;font-size:13px;font-weight:700;background:var(--chip);color:var(--fg);white-space:nowrap}
.badge.ok{background:var(--ok);color:var(--okt)}.badge.warn{background:var(--warn);color:var(--warnt)}.badge.bad{background:var(--bad);color:var(--badt)}.badge.pri{background:var(--prit);color:var(--pri)}
.msg{padding:12px 14px;border-radius:12px;font-weight:600;font-size:15px}
.msg.ok{background:var(--ok);color:var(--okt)}.msg.bad{background:var(--bad);color:var(--badt)}.msg.warn{background:var(--warn);color:var(--warnt)}
.tabs{display:flex;gap:4px;padding:4px;background:var(--chip);border-radius:12px;flex-wrap:wrap}
.tab{flex:1;min-width:110px;min-height:40px;border:0;border-radius:9px;background:transparent;font-weight:600;color:var(--mut);cursor:pointer}
.tab.on{background:var(--card);color:var(--fg);font-weight:700;box-shadow:var(--shadow)}
.subj{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:16px;background:var(--card);border:1px solid var(--bd);text-align:start;cursor:pointer;min-width:0}
.subj:hover{border-color:var(--pri)}
.bar{height:8px;border-radius:6px;background:var(--chip);position:relative;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--pri)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{text-align:start;padding:10px 12px;border-bottom:1px solid var(--bd);font-size:15px;vertical-align:middle}
th{font-size:13px;color:var(--mut);font-weight:700}
.wk{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--card);flex-wrap:wrap}
.wk .t{flex:1;min-width:120px;font-weight:700}
.wk.lock{opacity:.6}
.q{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--bd);border-radius:14px;background:var(--card)}
.opt{display:flex;align-items:center;gap:12px;min-height:46px;padding:6px 12px;border:1px solid var(--bd);border-radius:10px;cursor:pointer;background:var(--inp)}
.opt input{width:20px;height:20px;accent-color:var(--pri);margin:0}
.opt.right{border-color:var(--okt);background:var(--ok);color:var(--okt)}
.opt.wrong{border-color:var(--badt);background:var(--bad);color:var(--badt)}
.timer{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;padding:6px 16px;border-radius:12px;background:var(--prit);color:var(--pri)}
.timer.low{background:var(--bad);color:var(--badt)}
.auth{max-width:460px;margin:32px auto 0;display:flex;flex-direction:column;gap:16px}
.center{text-align:center;align-items:center}
.stat{display:flex;flex-direction:column;gap:2px;padding:16px;border-radius:14px;background:var(--card);border:1px solid var(--bd)}
.stat b{font-size:28px;font-variant-numeric:tabular-nums}
.chk{display:flex;align-items:center;gap:12px;min-height:40px}
.chk input{width:20px;height:20px;accent-color:var(--pri);margin:0}
@media print{body>*:not(#modal){display:none!important}body{background:#fff!important;color:#000!important}.ov{position:static!important;background:none!important;padding:0!important;display:block!important}.dlg{max-height:none!important;overflow:visible!important;padding:0!important;background:#fff!important;color:#000!important}.noprint{display:none!important}.rep table{width:100%;border-collapse:collapse}.rep th,.rep td{border:1px solid #444;padding:6px 8px;text-align:right}}
.ov{position:fixed;inset:0;z-index:30;background:rgba(10,15,25,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--card);color:var(--fg);border-radius:18px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:12px}
.dlg ol,.dlg ul{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px}
textarea.csv{width:100%;min-height:160px;border:1px solid var(--bd);border-radius:10px;padding:10px;background:var(--inp);direction:ltr;text-align:left;font-family:ui-monospace,monospace;font-size:14px}

.qed{border:1px solid var(--bd);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--card)}
.qed textarea,.qed input[type=text]{width:100%;border:1px solid var(--bd);border-radius:10px;padding:8px 12px;background:var(--inp);min-height:44px}
.orow{display:flex;gap:8px;align-items:center}
.orow input[type=radio]{width:20px;height:20px;accent-color:var(--pri);margin:0;flex:none}
.model{padding:10px 12px;border-radius:10px;background:var(--prit);color:var(--fg);font-size:15px}
.net{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:700}
.net.on{background:var(--ok);color:var(--okt)}.net.off{background:var(--bad);color:var(--badt)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.qi{display:block;max-width:100%;max-height:320px;border-radius:10px;border:1px solid var(--bd);margin-block:4px}
.qi.sm{max-height:110px}
.sim{display:inline-flex;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--warn);color:var(--warnt);margin-inline-start:6px;vertical-align:middle}
.q[dir=ltr],.qed [dir=ltr]{text-align:left}
.note{padding:10px 12px;border:1px solid var(--bd);border-radius:10px;display:flex;flex-direction:column;gap:2px}
.note.new{border-color:var(--pri);background:var(--prit)}

.badge.warn{background:var(--warn);color:var(--warnt)}.opt.miss{background:var(--warn);color:var(--warnt);border-color:var(--warnt)}.spin{opacity:.6}
[hidden]{display:none!important}
.mopt input[type=radio],.mopt input[type=checkbox]{width:22px;height:22px;accent-color:var(--pri);margin:0;flex:none}
.mopt .inp{flex:1}
.net.sync{background:var(--warn,#fff3cd);color:var(--warnt,#6b4e00)}

/* ===== v3: واجهة أنعم ===== */
html{font-size:100%}
html[data-fs="lg"]{font-size:112.5%}html[data-fs="xl"]{font-size:125%}
body{font-size:1rem;line-height:1.7}
h1{font-size:1.75rem;font-weight:700}h2{font-size:1.3rem}h3{font-size:1.1rem}
.top{padding:14px 0;gap:14px}
.logo{border-radius:12px;width:40px;height:40px}
.nv{min-height:44px;border-radius:22px;padding:0 18px}
.nv.on{box-shadow:var(--shadow)}
.card{border-radius:20px;padding:22px;box-shadow:var(--shadow)}
.btn{min-height:48px;border-radius:24px;padding:0 24px;transition:background .15s,transform .08s}
.btn:active{transform:scale(.97)}
.btn.sm{min-height:42px;border-radius:21px;padding:0 18px}
.btn.del{background:var(--del);color:#fff}.btn.del:hover{background:var(--del);filter:brightness(.92);color:#fff}
.btn.del.o{background:var(--delbg);color:var(--delt);box-shadow:inset 0 0 0 1.5px var(--delt)}.btn.del.o:hover{background:var(--delbg);filter:brightness(.96);color:var(--delt)}
.fld input,.fld select,.fld textarea,.inp{min-height:48px;border-radius:14px;border:1.5px solid var(--bd)}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{border-color:var(--pri);outline:none;box-shadow:0 0 0 3px var(--prit)}
.badge{padding:3px 14px}
.msg{border-radius:14px}
.tabs{border-radius:16px;padding:5px}.tab{min-height:44px;border-radius:12px}
.wk{border-radius:18px;padding:14px 18px;min-height:64px;box-shadow:var(--shadow)}
.subj{flex-direction:row;align-items:center;gap:16px;padding:18px;border-radius:22px;box-shadow:var(--shadow);transition:transform .12s,border-color .15s}
.subj:hover{transform:translateY(-2px)}
.subj .tx{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.ic{width:56px;height:56px;border-radius:17px;display:flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:28px;height:28px}
.c0{background:var(--i0b);color:var(--i0f)}.c1{background:var(--i1b);color:var(--i1f)}.c2{background:var(--i2b);color:var(--i2f)}.c3{background:var(--i3b);color:var(--i3f)}.c4{background:var(--i4b);color:var(--i4f)}.c5{background:var(--i5b);color:var(--i5f)}
.subj.live{border:2px solid var(--pri)}
.hello{display:flex;flex-direction:column;gap:2px}.hello .g{font-size:.95rem;color:var(--mut)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 22px;border-radius:22px;background:var(--pri);color:var(--onpri)}
.banner b{font-size:1.15rem}.banner .sub{color:inherit;opacity:.9}
.banner .btn{background:var(--card);color:var(--pri2)}.banner .btn:hover{background:var(--card);filter:brightness(.95);color:var(--pri2)}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:34px 16px;text-align:center;color:var(--mut);border:1.5px dashed var(--bd);border-radius:20px}
.empty svg{width:44px;height:44px;color:var(--pri);opacity:.8}.empty b{color:var(--fg);font-size:1.05rem}
.sk{border-radius:16px;background:linear-gradient(90deg,var(--chip) 25%,var(--bd) 50%,var(--chip) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;min-height:72px}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.wrap.enter>*{animation:rise .3s ease both}
.wrap.enter>*:nth-child(2){animation-delay:.04s}.wrap.enter>*:nth-child(3){animation-delay:.08s}.wrap.enter>*:nth-child(4){animation-delay:.12s}
.ov{backdrop-filter:blur(2px)}.dlg{border-radius:22px;animation:rise .2s ease both}
.av{width:44px;height:44px;border-radius:50%;border:0;background:var(--prit);color:var(--pri2);font-weight:700;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.av:hover{background:var(--pri);color:var(--onpri)}
.pf{display:flex;align-items:center;gap:16px}.pf .av{width:72px;height:72px;font-size:2rem;cursor:default}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 16px;align-items:center}.kv dt{color:var(--mut);font-size:.9rem}.kv dd{margin:0;font-weight:600}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg .tab{flex:none;min-width:90px;background:var(--chip)}.seg .tab.on{background:var(--pri);color:var(--onpri)}
.exh{position:sticky;top:0;z-index:6;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px 18px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.exh .tl{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.pg{height:8px;border-radius:6px;background:var(--chip);overflow:hidden}.pg>i{display:block;height:100%;background:var(--pri);transition:width .25s}
.qns{display:flex;gap:8px;overflow-x:auto;padding-block:2px}
.qn{flex:none;width:44px;height:44px;border-radius:14px;border:1.5px solid var(--bd);background:transparent;font-weight:700;cursor:pointer;color:var(--fg)}
.qn.a{background:var(--pri);border-color:var(--pri);color:var(--onpri)}
.qn.f{box-shadow:0 0 0 3px var(--warn);border-color:var(--warnt)}
.q.flagged{border-color:var(--warnt);box-shadow:0 0 0 3px var(--warn)}
.opt{min-height:56px;border-radius:16px;border-width:1.5px;font-size:1.05rem;padding:8px 16px;transition:background .12s,border-color .12s}
.opt:has(input:checked){border-color:var(--pri);background:var(--prit);font-weight:600}
.opt input{width:24px;height:24px}
.q{border-radius:22px;padding:20px;gap:12px;box-shadow:var(--shadow)}
.q>b{font-size:1.2rem;line-height:1.6}
.flag{align-self:flex-start;min-height:42px;border-radius:21px;border:1.5px solid var(--bd);background:transparent;padding:0 16px;font-weight:600;cursor:pointer;color:var(--fg)}
.flag[aria-pressed=true]{background:var(--warn);border-color:var(--warnt);color:var(--warnt)}
.timer{border-radius:22px;padding:6px 18px}
.big{font-size:2.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.done{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:10px}
.done .ck{width:64px;height:64px;border-radius:50%;background:var(--ok);color:var(--okt);display:flex;align-items:center;justify-content:center}
.done .ck svg{width:34px;height:34px}
.auth .logo{border-radius:18px}
details.first{border:1.5px dashed var(--bd);border-radius:16px;padding:12px 16px}
details.first summary{cursor:pointer;font-weight:700;color:var(--pri)}
details.first ol{margin:8px 0 0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px}
th{position:sticky;top:0;background:var(--card)}
tbody tr:hover{background:var(--chip)}
.srch{max-width:360px}
.toast{position:fixed;inset-inline:16px;bottom:88px;z-index:40;max-width:520px;margin-inline:auto;background:var(--side);color:var(--onside);border-radius:18px;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;box-shadow:0 8px 30px rgba(0,0,0,.25);animation:rise .2s ease both}
.toast .lnk{color:var(--onside)}
.pgrow{display:flex;align-items:center;gap:12px}.pgrow .bar{flex:1}
@media (pointer:coarse){.btn.sm{min-height:44px}.lnk{min-height:44px}}
@media (max-width:640px){.kv{grid-template-columns:1fr}.top{gap:8px}}
.q{scroll-margin-top:190px}

/* ===== v11: أيقونات وأزرار ===== */
.btn svg,.nv svg{width:18px;height:18px;flex:none;margin-inline-end:6px;vertical-align:-4px}
.nv.bell{position:relative;padding:0 12px}.nv.bell svg{width:22px;height:22px;margin:0}
.nv.bell .badge{position:absolute;top:-2px;inset-inline-start:-4px;padding:0 6px;min-width:20px;justify-content:center;font-size:12px}
.btn.ed{background:#E6EEFB;color:#1F4F9A;box-shadow:inset 0 0 0 1.5px #1F4F9A}.btn.ed:hover{background:#E6EEFB;color:#1F4F9A;filter:brightness(.96)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.ed{background:#1B2B4A;color:#A9C6F5;box-shadow:inset 0 0 0 1.5px #A9C6F5}}
:root[data-theme="dark"] .btn.ed{background:#1B2B4A;color:#A9C6F5;box-shadow:inset 0 0 0 1.5px #A9C6F5}
.hd{display:flex;align-items:center;gap:10px}
.hi{width:40px;height:40px;border-radius:12px;background:var(--prit);color:var(--pri2);display:inline-flex;align-items:center;justify-content:center;flex:none}
h3.hd .hi{width:34px;height:34px;border-radius:10px}
.hi svg{width:22px;height:22px}h3.hd .hi svg{width:19px;height:19px}
.mi svg{width:16px;height:16px;vertical-align:-3px}

/* مراجعة الاختيارات: أخضر صحيح، أحمر خطأ، أصفر صحيحة لم تُختر (للمتعدد) */
function optReview(q,who){
  var s=who==='s',lab=s?{c:'اخترتها',w:'اخترتها وهي خطأ',m:'صحيحة · لم تختر'}:{c:'اختارها',w:'اختارها وهي خطأ',m:'صحيحة · لم يخترها'};
  var ch=q.chosen||[],cs=q.correct,known=cs!=null,multi=q.type==='multi',rc=0,rw=0;
  var h=q.options.map(function(o){var c=ch.indexOf(o.id)>-1,k=known&&cs.indexOf(o.id)>-1,miss=k&&!c&&multi,cl='',mk=c?(known?(k?'✓ ':'✗ '):'● '):(k?'✓ ':'○ '),tg='';
    if(c&&k){cl='right';rc++;tg=lab.c}else if(c){cl=known?'wrong':'';if(known)rw++;tg=known?lab.w:lab.c}
    else if(miss){cl='miss';mk='！ ';tg=lab.m}else if(k){cl='right';tg='الإجابة الصحيحة'}
    return '<div class="opt '+cl+'" style="justify-content:space-between"><span>'+mk+esc(o.body)+'</span><span class="sub"'+(miss?' style="color:inherit;font-weight:700"':'')+'>'+tg+'</span></div>'}).join('');
  if(multi&&known)h+='<div class="sub">الملخص: '+(s?'اخترت ':'اختار ')+n(rc)+' من '+n(cs.length)+' إجابات صحيحة، و'+n(rw)+' '+(rw===1?'اختياراً خطأ':'اختيارات خطأ')+'.</div>';
  return h}

function pvQs(qs,pa,show){return qs.map(function(q,i){var dr=' dir="'+(q.dir==='ltr'?'ltr':'rtl')+'"',hd=showQ(q,i+1);
    if(q.type==='essay')return '<div class="q"'+dr+'>'+hd+'<span class="hint">سؤال مقالي يصححه المدرس.</span><textarea class="inp"'+dr+' style="min-height:100px;padding:10px"></textarea>'+(show&&q.model?'<div class="msg ok">نموذج الإجابة: '+esc(q.model)+'</div>':'')+'</div>';
    return '<div class="q"'+dr+'>'+hd+'<span class="hint">'+(q.type==='mcq'?'اختر إجابة واحدة.':'اختر كل الإجابات الصحيحة.')+'</span>'+q.options.map(function(o,j){var on=(pa[i]||[]).indexOf(j)>-1;
      return '<label class="opt"><input type="'+(q.type==='mcq'?'radio':'checkbox')+'" name="pv'+i+'" data-chg="pva" data-i="'+i+'" data-j="'+j+'" data-t="'+q.type+'"'+(on?' checked':'')+'><span>'+esc(o.body)+(show&&o.correct?' <b>✓ صحيحة</b>':'')+'</span></label>'}).join('')+'</div>'}).join('')}

function tabsK(k){return '<div class="tabs">'+['A','C','H'].map(function(x){return '<button type="button" class="tab'+(k===x?' on':'')+'" data-act="tab" data-t="'+x+'">'+KN[x]+'</button>'}).join('')+'</div>'}
function vTClass(){
  var c=clsOf(R.c),k=R.tab||'A',list=(C.tas||[]).filter(function(a){return a.kind===k});
  var h='<div class="row"><button type="button" class="lnk" data-act="go" data-v="tHome">← الفصول</button></div><div><h1>'+esc(c.name)+' · '+esc(sn(R.sj))+'</h1><span class="sub">'+n(c.students.length)+' طالب</span></div>'+tabsK(k)+okm()+err();
  if(k==='H')h+='<div class="msg warn">الأداء المنزلي يُفتح تلقائياً عند نزوله ويقفل بعد أسبوع، ولا يحتاج فتحاً منك.</div>';
  else h+='<div class="sub">يمكنك الفتح خلال ٧ أيام من النزول. المدة من ٣٥ إلى ٩٠ دقيقة.</div>';
  h+=list.length?list.map(function(a){return cardTA(a,c,k)}).join(''):empty('inbox','مفيش حاجة نزلت لسه','هتظهر هنا أول ما تنزل.');
  return h}
function cardTA(a,c,k){
  var h='<div class="card"><div class="row" style="justify-content:space-between"><b>'+esc(a.title)+'</b><span class="row"><span class="sub">سلّم '+n(a.submitted)+' من '+n(c.students.length)+'</span>'+btn('معاينة كطالب','tPrev',{a:a.id},'sec sm')+'</span></div>';
  if(k==='H'){h+='<div class="row">'+(a.expired?bdg('انتهى الموعد','bad'):bdg('مفتوح حتى '+fd(a.deadline),'ok'))+(a.answers_visible?bdg('الإجابات مفتوحة','pri'):'')+'</div></div>';return h}
  var o=a.open;
  if(o){var total=Math.round((Date.parse(o.end_at)-Date.parse(o.start_at))/MIN);
    h+='<div class="row">'+bdg('مفتوح الآن حتى '+ft(o.end_at),'ok')+'<span class="sub">'+n(o.students)+' طالب · المدة '+n(total)+' دقيقة</span></div><div class="row">'+btn('− ٥ دقائق','openMin',{o:o.id,m:total-5},'sec sm',total<=35)+btn('+ ٥ دقائق','openMin',{o:o.id,m:total+5},'sec sm',total>=90)+btn('إغلاق الآن','closeOpen',{o:o.id},'sec sm')+'</div><span class="hint">عند الإغلاق المبكر يكمل من بالداخل حتى مرور ٣٥ دقيقة من البداية.</span>'}
  else if(a.revealed||a.answers_visible)h+='<div class="row">'+bdg(a.revealed?'فُتح نموذج الإجابة للفصل':'الإجابات مفتوحة تلقائياً','pri')+'</div>';
  else{
    if(a.expired)h+='<div class="msg warn">انتهت مهلة الفتح (٧ أيام من النزول).</div>';
    else if(R.openA===a.id){var f=R.of;h+='<div class="row"><b>المدة</b><span class="row" style="gap:8px;flex-wrap:nowrap">'+btn('−','dur',{d:-5},'sec sm')+'<b style="min-width:90px;text-align:center">'+n(f.dur)+' دقيقة</b>'+btn('+','dur',{d:5},'sec sm')+'</span><span class="hint">من ٣٥ إلى ٩٠ دقيقة.</span></div><div><b>الطلاب الذين سيُفتح لهم ('+n(c.students.length-f.off.length)+' من '+n(c.students.length)+')</b>'+c.students.map(function(s){return '<label class="chk"><input type="checkbox" data-chg="stu" data-id="'+s.id+'"'+(f.off.indexOf(s.id)<0?' checked':'')+'><span>'+esc(s.name)+'</span></label>'}).join('')+'</div><div class="row">'+btn('فتح '+KN[k]+' للطلاب','doOpen',{a:a.id})+btn('إلغاء','cancelOpen','','sec')+'</div>';}
    else h+='<div class="row">'+btn('فتح للطلاب','askOpen',{a:a.id})+(a.ever_opened?btn('فتح نموذج الإجابة للفصل','askReveal',{a:a.id},'sec'):'')+'</div>';
    if(R.revA===a.id)h+='<div class="msg warn">سيرى طلاب الفصل الإجابات الصحيحة ودرجاتهم بعد الفتح. متأكد؟</div><div class="row">'+btn('نعم، افتح النموذج','doReveal',{a:a.id})+btn('إلغاء','cancelReveal','','sec')+'</div>'}
  return h+oneForm(a,c)+'</div>'}
function oneForm(a,c){
  if(a.expired||a.revealed||a.answers_visible)return '';
  if(R.oneA!==a.id)return '<div class="row">'+btn('فتح لطالب واحد','askOne',{a:a.id},'sec sm')+'</div>';
  var f=R.on||{dur:40};
  return '<div class="card"><b>فتح لطالب واحد</b><span class="hint">للطالب الغايب أو اللي تعطّل عنده النت. المدة من ٣٥ إلى ٩٠ دقيقة.</span>'+sel('الطالب','os',[['','اختر طالباً']].concat(c.students.map(function(s){return [s.id,s.name]})))+'<div class="row"><b>المدة</b>'+btn('−','durOne',{d:-5},'sec sm')+'<b style="min-width:90px;text-align:center">'+n(f.dur)+' دقيقة</b>'+btn('+','durOne',{d:5},'sec sm')+'</div><div class="row">'+btn('فتح','doOne',{a:a.id})+btn('إلغاء','cancelOne','','sec')+'</div></div>'}
H.askOne=function(ds){R.oneA=+ds.a;R.on={dur:40};R.f.os='';R.f.err='';R.f.ok='';draw()};
H.cancelOne=function(){R.oneA=null;draw()};
H.durOne=function(ds){R.on.dur=Math.max(35,Math.min(90,R.on.dur+(+ds.d)));draw()};
H.doOne=async function(ds){
  var f=R.f;f.err='';f.ok='';if(!f.os){f.err='اختر الطالب.';return draw()}
  try{await rpc('teacher_open_student',{p_class:R.c,p_aid:+ds.a,p_student:f.os,p_minutes:R.on.dur});R.oneA=null;f.ok='تم الفتح للطالب.';await reload()}
  catch(e){f.err=emsg(e);draw()}};


function gkey(p){return p.sub_id+'#'+p.question_id}
function gdef(p){return p.type==='multi'?0:Number(p.points)}
var DR=null,DRK='';
function drLoad(){var k='trial-gdr-'+(P&&P.code||'x');if(DR==null||DRK!==k){DRK=k;DR=lsGet(k)||{}}return DR}
function drSave(){lsSet(DRK,DR)}
function drCount(sub){var d=drLoad();return Object.keys(d).filter(function(k){return sub==null||String(d[k].s)===String(sub)}).length}
function gval(p){var d=drLoad()[gkey(p)];return d?d.p:gdef(p)}
function dval(p){var d=drLoad()[gkey(p)];return d?d.p:(p.points_got==null?null:Number(p.points_got))}
function vTGrading(){
  var ps=C.pend||[];
  return '<h1>التصحيح</h1><div class="sub">'+(ps.length?n(ps.length)+' إجابة تنتظر درجتك':'')+'</div>'+okm()+err()+(ps.length?ps.map(function(p){
    return '<div class="card"><div class="row" style="justify-content:space-between"><b>'+esc(p.student)+'</b><span class="sub">'+esc(p.class)+' · '+esc(sn(p.assessment.subject_id))+' · '+esc(p.assessment.title)+'</span></div><div class="sub">'+esc(p.body)+' ('+fmtN(p.points)+' درجة)</div>'+qimg(p.image)+qReview(toQ(p),'t')+'<div class="row">'+stepper('gstep',{k:gkey(p)},gval(p),p.points)+(drLoad()[gkey(p)]?bdg('لم يُعتمد · محفوظ على الجهاز','warn'):btn('تثبيت الدرجة','gfix',{k:gkey(p)},'sec sm'))+'<span class="hint">'+(p.type==='multi'?'اختار الطالب إجابة غير مطابقة: حدد درجته بالسهم ▲ (نصف درجة في كل ضغطة).':'نصف درجة في كل ضغطة.')+'</span></div></div>'}).join(''):'<div class="card"><div class="msg ok">لا توجد إجابات تنتظر تصحيحك.</div></div>')+apprBar(ps)}
function apprBar(ps){var dc=drCount(),left=(ps||[]).filter(function(p){return !drLoad()[gkey(p)]}).length;
  if(!dc&&!left)return '';
  return '<div class="dbar" role="region" aria-label="اعتماد النتيجة"><span class="sub">'+(dc?'<b>'+n(dc)+'</b> درجة جاهزة للاعتماد. الطالب مش هيشوف أي درجة إلا بعد الاعتماد، ويوصله إشعار واحد.':'لسه ما ثبّتّ أي درجة.')+(left?'<br>متبقي '+n(left)+' سؤال مقالي لم يُصحح.':'')+'</span>'+btn('اعتمد النتيجة','gApprove','','',!dc||BUSY)+'</div>'}
function toQ(p){return {type:p.type,body:p.body,dir:p.dir,image:p.image,points:p.points,options:p.options,chosen:p.chosen,text:p.text,correct:p.correct,model:p.model}}

function vTResults(){
  var cs=C.cls||[];if(!cs.length)return '<h1>النتائج</h1><div class="msg warn">لا توجد فصول.</div>';
  var f=R.f,c=clsOf(f.c)||cs[0],sjs=c.subjects||[],tas=C.tas||[],weeks=C.weeks||[];
  var head='<h1>النتائج</h1><div class="card"><div class="row">'+sel('الفصل','c',cs.map(function(x){return [x.id,x.name]}),1)+sel('المادة','sj',sjs.map(function(s){return [s.id,s.name]}),1)+(weeks.length?sel('الأسبوع','w',weeks.map(function(w){return [w,'الأسبوع '+n(w)]}),1):'')+'</div>';
  if(!weeks.length)return head+'<div class="msg warn">لا يوجد شيء نزل لهذه المادة بعد.</div></div>';
  head+='<div class="tabs" role="group" aria-label="نوع النتائج">'+['A','C','H'].map(function(x){return '<button type="button" class="tab'+(f.k===x?' on':'')+'" data-act="rkind" data-t="'+x+'" aria-pressed="'+(f.k===x?'true':'false')+'">'+KN[x]+'</button>'}).join('')+'</div>';
  var a=tas.filter(function(x){return x.week==f.w&&x.kind===f.k})[0];
  if(!a)return head+'<div class="msg warn">لا يوجد '+KN[f.k]+' في الأسبوع '+n(f.w)+'.</div></div>';
  var rows=C.res||[],cn=rows.filter(function(r){return r.counted}),sum=0;cn.forEach(function(r){sum+=Number(r.score||0)});
  var body=rows.map(function(r){var b,sc='—';
    if(r.status==='none')b=bdg('لم يسلّم','bad');else if(r.status==='solving')b=bdg('يحل الآن','pri');
    else if(r.late&&!r.late_decision)b=bdg('متأخر','warn')+' '+btn('قبول','late',{s:r.sub_id,v:1},'sm')+' '+btn('رفض','late',{s:r.sub_id,v:0},'sec sm');
    else if(r.late_decision==='rejected')b=bdg('رُفض (متأخر)','bad');
    else{b=bdg('سلّم','ok')+(r.late?' '+bdg('متأخر · مقبول','pri'):'');sc=fmtN(r.score)+' من '+fmtN(r.max)+(r.awaiting_teacher?' '+bdg('بانتظار التصحيح','warn'):'')}
    return '<tr><td>'+esc(r.name)+'</td><td>'+b+'</td><td>'+sc+'</td><td>'+(r.sub_id&&r.status==='submitted'?btn('تفاصيل / تعديل','detail',{s:r.sub_id},'sec sm'):'')+'</td></tr>'}).join('');
  return head+'</div><div class="row"><div class="stat"><span class="sub">سلّموا</span><b>'+n(cn.length)+'/'+n(rows.length)+'</b></div><div class="stat"><span class="sub">متوسط الدرجات</span><b>'+(cn.length?fmtN(Math.round(sum/cn.length*10)/10):'—')+'</b></div>'+btn('تصدير PDF','pdf','','sec')+btn('تقرير الفصل كامل','classRep','','sec')+'</div><div class="card"><div class="tbl"><table><thead><tr><th>الطالب</th><th>الحالة</th><th>الدرجة</th><th></th></tr></thead><tbody>'+body+'</tbody></table></div></div>'}

var GN=['','الأول الثانوي','الثاني الثانوي','الثالث الثانوي'];
function gOpts(){return [[1,GN[1]],[2,GN[2]],[3,GN[3]]]}
function ta(l,k,ph){return '<label class="fld"><span>'+l+'</span><textarea data-bind="'+k+'" placeholder="'+esc(ph||'')+'" style="min-height:130px">'+esc((R.f&&R.f[k])||'')+'</textarea></label>'}
function norm(x){return String(x==null?'':x).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).toLowerCase()}
function srchBox(ph){return '<label class="fld srch"><span>بحث</span><input id="f_q" class="inp" data-srch="1" type="search" autocomplete="off" placeholder="'+esc(ph)+'" value="'+esc((R.f&&R.f.q)||'')+'"></label>'}
function hasQ(txt){var q=norm((R.f&&R.f.q)||'').trim();return !q||norm(txt).indexOf(q)>-1}
function accById(id){var a=C.ad;return a.students.concat(a.teachers).filter(function(x){return x.id===id})[0]}

  if(c&&c.id===s.id&&c.k==='arch')return '<span class="sub">سيُخفى المدرس وتُشال تعييناته من الفصول، وتظل درجات طلابه. متأكد؟</span> '+btn('نعم، أرشف','accDo','','sm')+' '+btn('إلغاء','accNo','','sec sm');

var PUSH={ok:false,on:false,key:null,busy:false};
function b64u(s){var p='='.repeat((4-s.length%4)%4),r=atob((s+p).replace(/-/g,'+').replace(/_/g,'/')),o=new Uint8Array(r.length);for(var i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o}
async function pushInit(){PUSH.ok=!!(navigator.serviceWorker&&window.PushManager&&window.Notification&&/^https:/.test(location.protocol));if(!PUSH.ok)return;
  try{var reg=await navigator.serviceWorker.ready,s=await reg.pushManager.getSubscription();PUSH.on=!!s&&Notification.permission==='granted';var k=await rpc('push_public_key');PUSH.key=(typeof k==='string'&&k)?k:null}catch(e){}
  if(R.v==='profile')draw()}
H.pushOn=async function(){var f=R.f;f.err='';f.ok='';PUSH.busy=true;draw();
  try{if(!PUSH.key)throw new Error('التنبيهات اللحظية لسه مش مفعّلة من إدارة النظام.');
    var perm=await Notification.requestPermission();if(perm!=='granted')throw new Error('لازم توافق على إذن الإشعارات من المتصفح.');
    var reg=await navigator.serviceWorker.ready,key=b64u(PUSH.key),s=await reg.pushManager.getSubscription();
    if(s&&s.options&&s.options.applicationServerKey){var ok0=new Uint8Array(s.options.applicationServerKey);if(ok0.length!==key.length||ok0.some(function(v,i){return v!==key[i]})){await s.unsubscribe();s=null}}
    if(!s)s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});
    var j=s.toJSON();
    await rpc('save_push',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth});PUSH.on=true;f.ok='اتفعّلت تنبيهات الجهاز.'}
  catch(e){f.err=emsg(e)}PUSH.busy=false;draw()};
async function pushDrop(){try{if(!PUSH.ok||!navigator.serviceWorker)return;var reg=await navigator.serviceWorker.ready,s=await reg.pushManager.getSubscription();if(s){var ep=s.endpoint;try{await Promise.race([rpc('drop_push',{p_endpoint:ep}),new Promise(function(_,rj){setTimeout(rj,2500)})])}catch(e){}await s.unsubscribe()}PUSH.on=false}catch(e){}}
H.pushOff=async function(){var f=R.f;PUSH.busy=true;draw();await pushDrop();PUSH.busy=false;f.ok='اتقفلت تنبيهات الجهاز.';draw()};

  if(FLUSHING||!P||!C.queue.length||!navigator.onLine||Date.now()<FB.next)return;FLUSHING=true;var changed=false;
  try{while(C.queue.length){var it=C.queue[0];
    if(it.due&&Date.now()<it.due){setTimeout(flushQueue,it.due-Date.now()+150);break}
    try{await rpc('submit_exam',{p_aid:it.aid,p_answers:it.answers,p_finished:it.fin,p_auto:it.auto});C.queue.shift();saveQ();changed=true;FB.n=0;FB.next=0}
    catch(e){
      if(e.net||e.status>=500||e.status===429){FB.n++;FB.next=Date.now()+Math.min(15000*Math.pow(2,FB.n-1),120000);setTimeout(flushQueue,FB.next-Date.now()+150);break}
      C.queue.shift();saveQ();changed=true;if(!/سلّمت|already/.test(e.message))C.lastErr=emsg(e)}}
  }finally{FLUSHING=false}
  if(changed){rcClear();if(R.v==='sSubject'||R.v==='sHome'||R.v==='sResult'||R.v==='sGrades')await reload();else draw()}else if(R.v==='sResult'||R.v==='sSubject')draw()}
