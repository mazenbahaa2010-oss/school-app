/* مراجعة الاختيارات: أخضر صحيح، أحمر خطأ، أصفر صحيحة لم تُختر (للمتعدد) */
function optReview(q,who){
  var s=who==='s',lab=s?{c:'اخترتها',w:'اخترتها وهي خطأ',m:'صحيحة · لم تختر'}:{c:'اختارها',w:'اختارها وهي خطأ',m:'صحيحة · لم يخترها'};
  var ch=q.chosen||[],cs=q.correct,known=cs!=null,multi=q.type==='multi',rc=0,rw=0;
  var h=q.options.map(function(o){var c=ch.indexOf(o.id)>-1,k=known&&cs.indexOf(o.id)>-1,miss=k&&!c&&multi,cl='',mk=c?(known?(k?'✓ ':'✗ '):'● '):(k?'✓ ':'○ '),tg='';
    if(c&&k){cl='right';rc++;tg=lab.c}else if(c){cl=known?'wrong':'';if(known)rw++;tg=known?lab.w:lab.c}
    else if(miss){cl='miss';mk='！ ';tg=lab.m}else if(k){cl='right';tg='الإجابة الصحيحة'}
    return '<div class="opt '+cl+'" style="justify-content:space-between"><span>'+mk+esc(o.body)+'</span><span class="sub"'+(miss?' style="color:inherit;font-weight:700"':'')+'>'+tg+'</span></div>'}).join('');
  if(multi&&known)h+='<div class="sub">الملخص: '+(s?'اخترت ':'اختار ')+n(rc)+' من '+n(cs.length)+' إجابات صحيحة، و'+n(rw)+' '+(rw===1?'اختياراً خطأ':'اختيارات خطأ')+'.</div>';
  return h}
function qReview(q,who){
  if(q.type==='essay'){var mine=q.text&&String(q.text).trim();
    return '<div class="sub">'+(who==='s'?'إجابتك:':'إجابة الطالب:')+'</div><div dir="'+(q.dir==='ltr'?'ltr':'rtl')+'">'+(mine?esc(q.text):'<span class="sub">لم يُكتب شيء</span>')+'</div>'+(q.model?'<div class="model"><b>نموذج الإجابة:</b> '+esc(q.model)+'</div>':'')}
  return (who==='t'?'<div class="sub">'+(q.type==='multi'?'اختيارات الطالب: الأخضر صحيح، والأحمر خطأ، والأصفر صحيحة لم يخترها.':'اختيار الطالب:')+'</div>':'')+optReview(q,who)}
function scoreBadge(q){if(q.points_got==null)return bdg('بانتظار تصحيح المدرس','warn');return bdg('درجتك: '+fmtN(q.points_got)+' من '+fmtN(q.points),Number(q.points_got)>=Number(q.points)?'ok':'warn')+(q.edited?' '+bdg('عدّل المدرس هذه الدرجة','pri'):'')}

/* ---------- PDF مباشر (بدون طباعة): صفحات مرسومة على canvas ومحزومة في ملف PDF ---------- */
function makePdf(title,sub,heads,rows,note,fname){
  var land=heads.length>7,W=land?1754:1240,Hh=land?1240:1754,M=70,cols=heads.length,PW=land?842:595,PH=land?595:842;
  var fs=cols>12?19:(cols>7?23:27),RH=Math.round(fs*2),FF='Cairo,Tahoma,"Segoe UI",Arial,sans-serif';
  var cv=document.createElement('canvas');cv.width=W;cv.height=Hh;var cx=cv.getContext('2d');
  cx.font=fs+'px '+FF;
  var wts=heads.map(function(h,i){var m=Math.min(cx.measureText(h).width,fs*12);rows.forEach(function(r){m=Math.max(m,Math.min(cx.measureText(String(r[i]==null?'':r[i])).width,fs*16))});return m+28});
  var tot=wts.reduce(function(a,b){return a+b},0),sc=(W-2*M)/tot;wts=wts.map(function(w){return w*sc});
  var pages=[],y=0,pn=0;
  function txt(t,xr,yy,w,bold,color){
    t=String(t==null?'':t);cx.font=(bold?'bold ':'')+fs+'px '+FF;cx.fillStyle=color||'#111';
    var ltr=/^[\x20-\x7E]+$/.test(t);cx.direction=ltr?'ltr':'rtl';cx.textAlign='right';
    while(t.length>1&&cx.measureText(t).width>w-16)t=t.slice(0,-1);
    cx.fillText(t,xr-8,yy)}
  function head(){
    cx.fillStyle='#e6eef0';cx.fillRect(M,y,W-2*M,RH);var xr=W-M;
    heads.forEach(function(h,i){txt(h,xr,y+RH*0.68,wts[i],true);xr-=wts[i]});
    cx.strokeStyle='#8a9a9e';cx.lineWidth=1.5;cx.strokeRect(M,y,W-2*M,RH);y+=RH}
  function newPage(first){
    if(pn){pages.push(cv.toDataURL('image/jpeg',.82))}
    pn++;cx.fillStyle='#fff';cx.fillRect(0,0,W,Hh);cx.direction='rtl';cx.textAlign='right';y=M;
    if(first){cx.fillStyle='#0b6e69';cx.font='bold '+(fs+12)+'px '+FF;cx.fillText(title,W-M,y+fs+8);y+=fs*3.2;
      cx.fillStyle='#555';cx.font=(fs-3)+'px '+FF;cx.fillText(sub,W-M,y);y+=fs*1.6}
    head()}
  newPage(true);
  rows.forEach(function(r,ri){
    if(y+RH>Hh-M-50)newPage(false);
    if(ri%2)(cx.fillStyle='#f6f9fa',cx.fillRect(M,y,W-2*M,RH));
    var xr=W-M;r.forEach(function(c,i){txt(c,xr,y+RH*0.68,wts[i]);xr-=wts[i]});
    cx.strokeStyle='#c5d0d3';cx.lineWidth=1;cx.beginPath();cx.moveTo(M,y+RH);cx.lineTo(W-M,y+RH);cx.stroke();y+=RH});
  if(!rows.length){cx.fillStyle='#555';cx.font=fs+'px '+FF;cx.direction='rtl';cx.textAlign='right';cx.fillText('لا توجد بيانات.',W-M-8,y+RH*0.7);y+=RH}
  if(note){y+=RH*0.6;cx.fillStyle='#8a1c1c';cx.font=(fs-2)+'px '+FF;cx.direction='rtl';cx.textAlign='right';cx.fillText(String(note).slice(0,140),W-M,y)}
  pages.push(cv.toDataURL('image/jpeg',.82));
  var out=[],off=0,xr=[],enc=new TextEncoder();
  function add(x){var b=typeof x==='string'?enc.encode(x):x;out.push(b);off+=b.length}

async function flushQueue(){
  if(FLUSHING||!P||!C.queue.length||!navigator.onLine||Date.now()<FB.next)return;FLUSHING=true;var changed=false;
  try{while(C.queue.length){var it=C.queue[0];
    if(it.due&&Date.now()<it.due){setTimeout(flushQueue,it.due-Date.now()+150);break}
    try{await rpc('submit_exam',{p_aid:it.aid,p_answers:it.answers,p_finished:it.fin,p_auto:it.auto});C.queue.shift();saveQ();changed=true;FB.n=0;FB.next=0}
    catch(e){
      if(e.net||e.status>=500||e.status===429){FB.n++;FB.next=Date.now()+Math.min(15000*Math.pow(2,FB.n-1),120000);setTimeout(flushQueue,FB.next-Date.now()+150);break}
      C.queue.shift();saveQ();changed=true;if(!/سلّمت|already/.test(e.message))C.lastErr=emsg(e)}}
  }finally{FLUSHING=false}
  if(changed){rcClear();if(R.v==='sSubject'||R.v==='sHome'||R.v==='sResult'||R.v==='sGrades')await reload();else draw()}else if(R.v==='sResult'||R.v==='sSubject')draw()}

H.doMyPw=async function(){
  var f=R.f;f.merr='';
  if(!f.opw||!f.npw||!f.npw2){f.merr='املأ الخانات التلاتة.';return draw()}
  if(f.npw.length<6){f.merr='كلمة المرور الجديدة لازم تكون ٦ أحرف على الأقل.';return draw()}
  if(f.npw!==f.npw2){f.merr='كلمتا المرور الجديدتان غير متطابقتين.';return draw()}
  if(f.npw===f.opw){f.merr='الجديدة لازم تختلف عن الحالية.';return draw()}
  BUSY=true;draw();
  try{
    if(Date.now()>SES.exp)await refreshSes();
    var u=await http('/auth/v1/user',{headers:{apikey:CFG.key,Authorization:'Bearer '+SES.a}});
    var j;try{j=await http('/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:CFG.key,'Content-Type':'application/json'},body:JSON.stringify({email:u.email,password:f.opw})})}
    catch(x){if(x.net)throw x;var er=new Error('كلمة المرور الحالية غير صحيحة.');throw er}
    setSes(j);
    await http('/auth/v1/user',{method:'PUT',headers:{apikey:CFG.key,Authorization:'Bearer '+SES.a,'Content-Type':'application/json'},body:JSON.stringify({password:f.npw})});
    f.opw=f.npw=f.npw2='';MODAL='<h2>تم ✓</h2><div class="msg ok">تم تغيير كلمة المرور. استخدم الجديدة في المرة الجاية.</div>'+btn('إغلاق','closeModal')}
  catch(x){f.merr=emsg(x)}
  BUSY=false;draw()};

H.gDo=async function(){
  var c=R.gc,f=R.f;if(!c)return;f.err='';f.ok='';
  try{
    if(c.k==='rs'||c.k==='re'){R.gc=null;var r=await fnCall({action:'reset_password',account_id:c.id,password:f.rpw||undefined});f.rpw='';MODAL=credHtml([{name:c.name,code:c.code,password:r.password}],'كلمة مرور جديدة')}
    else if(c.k==='de'){R.gc=null;await fnCall({action:'delete_editor',account_id:c.id});await refreshMg();f.ok='تم حذف المحرر.'}
    else if(c.k==='dsub'){R.gc=null;await rpc('m_delete_subject',{p_id:+c.id});await refreshMg();REF=await rpc('ref_data');f.ok='تم حذف المادة.'}
    else if(c.k==='ds'){
      if(String(f.dcode||'').trim()!==String(c.code)){f.err='اكتب كود المدرسة بالظبط للتأكيد.';return draw()}
      R.busy=true;draw();var done=false,guard=0;
      while(!done&&guard++<300){var x=await fnCall({action:'delete_school',school_id:c.sid});done=!!x.done}
      R.gc=null;R.busy=false;await refreshMg();f.dcode='';f.ok='تم حذف المدرسة.'}
  }catch(e){f.err=emsg(e);R.busy=false;if(c.k!=='ds')R.gc=null;else if(R.gc)R.gc=c}
  draw()};

function bind(e,ch){
  var el=e.target,ds=el.dataset;
  if(ds.chg==='ans'){var ex=C.ex;if(ex){ex.ans[+ds.q]=+el.value;saveEx(ex)}return}
